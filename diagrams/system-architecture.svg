<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)" rx="12"/>

  <!-- Title Header -->
  <text x="450" y="40" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">XYVEX System Architecture Topology</text>
  <text x="450" y="62" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Multi-Tenant Decoupled 3-Tier Security Workspace Architecture</text>

  <!-- Layer 1: Client Browser -->
  <g transform="translate(100, 90)" filter="url(#shadow)">
    <rect width="700" height="75" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="700" height="6" rx="3" fill="url(#accentGrad)"/>
    <text x="350" y="32" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#38bdf8" text-anchor="middle">Client Layer (Web Browser SPA)</text>
    <text x="350" y="54" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">React 18  •  TypeScript  •  Vite  •  Tailwind CSS  •  Axios Interceptors</text>
  </g>

  <!-- Down Arrow 1 -->
  <path d="M 450 165 L 450 195" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="445,195 450,203 455,195" fill="#38bdf8"/>
  <text x="465" y="185" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8">HTTPS / JSON API</text>

  <!-- Layer 2: Gateway / Reverse Proxy -->
  <g transform="translate(100, 205)" filter="url(#shadow)">
    <rect width="700" height="65" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="350" y="28" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#818cf8" text-anchor="middle">Reverse Proxy Gateway (Nginx)</text>
    <text x="350" y="48" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">TLS Termination  •  Static Asset Distribution  •  Security Headers &amp; Rate Limiting</text>
  </g>

  <!-- Down Arrow 2 -->
  <path d="M 450 270 L 450 300" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="445,300 450,308 455,300" fill="#818cf8"/>
  <text x="465" y="290" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8">Unix Socket / HTTP Proxy</text>

  <!-- Layer 3: Application Server -->
  <g transform="translate(100, 310)" filter="url(#shadow)">
    <rect width="700" height="75" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="350" y="28" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#34d399" text-anchor="middle">Application Server Layer (FastAPI + Python 3.12)</text>
    <text x="350" y="50" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">JWT Token Manager  •  Fernet AES-256 Field Encryption  •  Redaction Engine  •  Pydantic Schemas</text>
  </g>

  <!-- Down Arrow 3 -->
  <path d="M 450 385 L 450 415" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="445,415 450,423 455,415" fill="#34d399"/>
  <text x="465" y="405" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94a3b8">Async SQLAlchemy ORM</text>

  <!-- Layer 4: Database -->
  <g transform="translate(100, 425)" filter="url(#shadow)">
    <rect width="700" height="55" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="350" y="24" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#f43f5e" text-anchor="middle">Relational Database Layer (PostgreSQL 16 + Alembic)</text>
    <text x="350" y="42" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Multi-Tenant Scoped Tables  •  Encrypted Credentials &amp; Proofs  •  Atomic Migration Versioning</text>
  </g>
</svg>
